# 构建 CADCraft 的 OTools 插件前端（WASM → dist/）并上传产物。
# 触发：push 到 main、PR、手动。
#
# 两个 job：
# - wasm：构建前端产物 dist/（拷到 otools 仓库的 plugins/otools-cadcraft/dist 即可用）。
# - native：编译 native 适配层（上游 cadcraft-mcp 的 headless 后端），
#   只做「能不能编过 + 单测过」的 PR 门禁；正式多平台产物由 release-plugin.yml 出。
#
# 上游源码不在 git 里：scripts/build-wasm.mjs 会先按 upstream.pin 拉取，再跑 trunk。
name: build-plugin

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: 安装工具链
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - name: 安装 trunk
        run: cargo install trunk --locked

      - name: 缓存 cargo 与 trunk 工具
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            shell/target
            ~/.cache/trunk
          key: cadcraft-wasm-${{ runner.os }}-${{ hashFiles('shell/Cargo.lock', 'upstream/Cargo.lock') }}
          restore-keys: cadcraft-wasm-${{ runner.os }}-

      - name: 构建 dist/
        run: node scripts/build-wasm.mjs

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: otools-cadcraft-dist
          path: dist/
          if-no-files-found: error

  # native 适配层在 PR 阶段就跑一次，避免「上游同步后 native 编不过」直到发版才发现。
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 拉取上游源码
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: node scripts/fetch-upstream.mjs
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native -> native/target
          key: plugin-native-ci
      - name: 编译并测试 native 适配层
        run: cargo test --release --manifest-path native/Cargo.toml
